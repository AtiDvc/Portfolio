<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #ffffff;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================================
           DESKTOP
        ========================================================= */

        .portfolio {
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .sheet {
            position: relative;

            width: min(84vw, 1200px);
            aspect-ratio: 297 / 210;

            background: #ffffff;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: visible;
        }


        #portfolioImage {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: none;
        }

        #portfolioImage.visible {
            display: block;
        }


        /* =========================================================
           DESKTOP PFEILE
        ========================================================= */

        .arrow {
            position: absolute;

            top: 50%;

            width: 30px;
            height: 50px;

            padding: 0;
            margin: 0;

            border: none;
            outline: none;

            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transform: translateY(-50%);

            z-index: 10;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }

        .arrow:hover {
            opacity: 0.6;
        }

        .arrow:focus,
        .arrow:focus-visible,
        .arrow:active {
            outline: none;
            border: none;
            box-shadow: none;
        }

        .arrow svg {
            width: 18px;
            height: 32px;
            display: block;
        }

        .arrow-left {
            left: -55px;
        }

        .arrow-left svg {
            transform: rotate(180deg);
        }

        .arrow-left:hover {
            transform: translate(-5px, -50%);
        }

        .arrow-right {
            right: -55px;
        }

        .arrow-right:hover {
            transform: translate(5px, -50%);
        }

        .arrow.disabled {
            opacity: 0.15;
            pointer-events: none;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 800px) {

            .portfolio {
                width: 100vw;
                height: 100svh;

                overflow: hidden;

                display: block;
            }


            /* =====================================================
               SICHTBARER BEREICH
            ===================================================== */

            .mobile-viewport {
                position: fixed;

                inset: 0;

                width: 100vw;
                height: 100svh;

                overflow: hidden;

                touch-action: pan-y;

                background: #ffffff;
            }


            /* =====================================================
               MOBILE STAGE

               Die Stage enthält immer nur die tatsächlich
               vorhandenen A4-Seiten.

               Jede Seite ist ein echtes A4-Blatt.
            ===================================================== */

            .mobile-stage {
                position: absolute;

                top: 50%;
                left: 0;

                height: min(
                    106.06vw,
                    78svh
                );

                display: flex;
                align-items: center;

                will-change: transform;
            }


            /* =====================================================
               ECHTES A4-BLATT

               297 / 210

               Die Breite ergibt sich aus der Höhe.
            ===================================================== */

            .mobile-sheet {
                position: relative;

                height: 100%;

                aspect-ratio: 297 / 210;

                flex: 0 0 auto;

                background: #ffffff;

                overflow: hidden;

                box-shadow:
                    0 18px 45px rgba(0, 0, 0, 0.18);
            }


            /* =====================================================
               BILD

               Das Bild füllt das komplette A4-Blatt.
            ===================================================== */

            .mobile-sheet img {
                position: absolute;

                inset: 0;

                width: 100%;
                height: 100%;

                object-fit: contain;

                display: block;

                user-select: none;
                -webkit-user-drag: none;

                pointer-events: none;
            }


            /* =====================================================
               BUCHKANTE

               Eine dezente Kante auf der Innenseite.
            ===================================================== */

            .mobile-sheet::after {
                content: "";

                position: absolute;

                top: 0;
                bottom: 0;

                width: 12px;

                pointer-events: none;

                z-index: 5;

                opacity: 0.8;
            }


            .mobile-sheet:nth-child(odd)::after {
                right: 0;

                background:
                    linear-gradient(
                        to left,
                        rgba(0, 0, 0, 0.10),
                        rgba(0, 0, 0, 0.025),
                        transparent
                    );
            }


            .mobile-sheet:nth-child(even)::after {
                left: 0;

                background:
                    linear-gradient(
                        to right,
                        rgba(0, 0, 0, 0.10),
                        rgba(0, 0, 0, 0.025),
                        transparent
                    );
            }


            /* =====================================================
               DESKTOP AUSBLENDEN
            ===================================================== */

            .sheet {
                display: none;
            }

        }

    </style>
</head>


<body>

    <main class="portfolio">


        <!-- =====================================================
             DESKTOP
        ===================================================== -->

        <div class="sheet">

            <img
                id="portfolioImage"
                alt="Portfolio"
            >


            <button
                id="prevButton"
                class="arrow arrow-left disabled"
                aria-label="Vorherige Seite"
            >

                <svg
                    viewBox="0 0 462.45 818.53"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polygon
                        fill="#1d1d1b"
                        points="
                            462.3 409.25
                            462.41 409.14
                            53.27 0
                            0 53.27
                            356.01 409.28
                            .04 765.26
                            53.31 818.53
                            462.45 409.39
                            462.3 409.25
                        "
                    />

                </svg>

            </button>


            <button
                id="nextButton"
                class="arrow arrow-right disabled"
                aria-label="Nächste Seite"
            >

                <svg
                    viewBox="0 0 462.45 818.53"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polygon
                        fill="#1d1d1b"
                        points="
                            462.3 409.25
                            462.41 409.14
                            53.27 0
                            0 53.27
                            356.01 409.28
                            .04 765.26
                            53.31 818.53
                            462.45 409.39
                            462.3 409.25
                        "
                    />

                </svg>

            </button>

        </div>


        <!-- =====================================================
             MOBILE
        ===================================================== -->

        <div
            class="mobile-viewport"
            id="mobileViewport"
        >

            <div
                class="mobile-stage"
                id="mobileStage"
            ></div>

        </div>

    </main>


    <script>

        /* =========================================================
           DESKTOP
        ========================================================= */

        const image =
            document.getElementById(
                "portfolioImage"
            );

        const prevButton =
            document.getElementById(
                "prevButton"
            );

        const nextButton =
            document.getElementById(
                "nextButton"
            );


        /* =========================================================
           MOBILE
        ========================================================= */

        const mobileViewport =
            document.getElementById(
                "mobileViewport"
            );

        const mobileStage =
            document.getElementById(
                "mobileStage"
            );


        /* =========================================================
           BILDER
        ========================================================= */

        const IMAGE_FOLDER =
            "images/portfolio";


        let currentPage = 1;
        let maxPage = 0;


        /*
         * MOBILE:
         *
         * 0 = Seite 1 links
         * 1 = Seite 1 rechts
         * 2 = Seite 2 links
         * 3 = Seite 2 rechts
         * 4 = Seite 3 links
         * usw.
         */

        let mobilePosition = 0;


        /* =========================================================
           BILD PRÜFEN
        ========================================================= */

        function checkImage(number) {

            return new Promise(resolve => {

                const testImage =
                    new Image();

                testImage.onload =
                    () => resolve(true);

                testImage.onerror =
                    () => resolve(false);

                testImage.src =
                    `${IMAGE_FOLDER}/${number}.png`;

            });

        }


        /* =========================================================
           BILDER FINDEN
        ========================================================= */

        async function findImages() {

            maxPage = 0;

            for (
                let number = 1;
                number <= 100;
                number++
            ) {

                const exists =
                    await checkImage(number);

                if (!exists) {
                    break;
                }

                maxPage = number;
            }


            if (maxPage === 0) {
                return;
            }


            showImage(1);

            createMobileSheets();

        }


        /* =========================================================
           DESKTOP
        ========================================================= */

        function showImage(number) {

            if (
                number < 1 ||
                number > maxPage
            ) {
                return;
            }

            currentPage = number;

            image.src =
                `${IMAGE_FOLDER}/${number}.png`;

            image.classList.add(
                "visible"
            );

            updateButtons();

        }


        function updateButtons() {

            if (currentPage <= 1) {

                prevButton.classList.add(
                    "disabled"
                );

            } else {

                prevButton.classList.remove(
                    "disabled"
                );

            }


            if (currentPage >= maxPage) {

                nextButton.classList.add(
                    "disabled"
                );

            } else {

                nextButton.classList.remove(
                    "disabled"
                );

            }

        }


        prevButton.addEventListener(
            "click",
            () => {

                if (currentPage > 1) {

                    showImage(
                        currentPage - 1
                    );

                }

            }
        );


        nextButton.addEventListener(
            "click",
            () => {

                if (currentPage < maxPage) {

                    showImage(
                        currentPage + 1
                    );

                }

            }
        );


        /* =========================================================
           MOBILE SEITEN
        ========================================================= */

        function createMobileSheets() {

            mobileStage.innerHTML = "";


            for (
                let page = 1;
                page <= maxPage;
                page++
            ) {

                const sheet =
                    document.createElement(
                        "div"
                    );

                sheet.className =
                    "mobile-sheet";


                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    `${IMAGE_FOLDER}/${page}.png`;

                img.alt =
                    `Portfolio Seite ${page}`;

                img.draggable = false;


                sheet.appendChild(img);

                mobileStage.appendChild(
                    sheet
                );

            }


            mobilePosition = 0;

            updateMobilePosition(false);

        }


        /* =========================================================
           MOBILE POSITION

           Wichtig:

           Wir verschieben NICHT einzelne Bilder.

           Wir verschieben die komplette A4-Seite.

           Dadurch kann niemals dieselbe PNG zweimal
           gleichzeitig an derselben Stelle liegen.
        ========================================================= */

        function updateMobilePosition(
            animate = true
        ) {

            const viewportWidth =
                window.innerWidth;


            /*
             * Breite eines echten A4-Blattes.
             *
             * Die Höhe wird von CSS bestimmt.
             */

            const stageHeight =
                Math.min(
                    viewportWidth * 1.0106,
                    window.innerHeight * 0.78
                );


            const pageWidth =
                stageHeight *
                (297 / 210);


            /*
             * Wir zeigen bewusst etwas mehr als
             * die Hälfte des A4-Blattes.
             */

            const visiblePart =
                viewportWidth * 0.72;


            /*
             * Linker Rand beim ersten Zustand.
             */

            const firstOffset =
                viewportWidth * 0.04;


            /*
             * Linker Ausschnitt:
             * A4 beginnt etwas links.
             */

            const leftOffset =
                firstOffset;


            /*
             * Rechter Ausschnitt:
             * Wir schieben das A4-Blatt nach links,
             * sodass sein rechter Bereich sichtbar wird.
             */

            const rightOffset =
                viewportWidth -
                pageWidth -
                viewportWidth * 0.04;


            /*
             * Abstand zwischen den beiden Zuständen.
             */

            const stateStep =
                viewportWidth * 0.92;


            let x;


            /*
             * Position 0:
             * Seite 1 links
             */

            if (mobilePosition === 0) {

                x = leftOffset;

            }


            /*
             * Position 1:
             * Seite 1 rechts
             */

            else if (mobilePosition === 1) {

                x =
                    leftOffset -
                    (
                        pageWidth -
                        visiblePart
                    );

            }


            /*
             * Danach:
             *
             * Seite 2 links
             * Seite 2 rechts
             * usw.
             *
             * Der Wechsel zwischen Seiten
             * erfolgt über einen echten Abstand
             * von einer kompletten A4-Seite.
             */

            else {

                const pageIndex =
                    Math.floor(
                        mobilePosition / 2
                    );

                const side =
                    mobilePosition % 2;


                const base =
                    pageIndex *
                    pageWidth;


                if (side === 0) {

                    x =
                        leftOffset -
                        base +
                        (
                            pageIndex > 0
                                ? viewportWidth
                                : 0
                        );

                } else {

                    x =
                        leftOffset -
                        base +
                        (
                            pageIndex > 0
                                ? viewportWidth
                                : 0
                        ) -
                        (
                            pageWidth -
                            visiblePart
                        );

                }

            }


            /*
             * Für die eigentliche Darstellung
             * verwenden wir eine exakt berechnete
             * Transformposition.
             */

            if (animate) {

                mobileStage.style.transition =
                    "transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1)";

            } else {

                mobileStage.style.transition =
                    "none";

            }


            mobileStage.style.transform =
                `translate3d(
                    ${x}px,
                    -50%,
                    0
                )`;

        }


        /* =========================================================
           MOBILE SWIPE
        ========================================================= */

        let touchStartX = 0;
        let touchCurrentX = 0;

        let isDragging = false;


        mobileViewport.addEventListener(
            "touchstart",
            event => {

                if (
                    event.touches.length !== 1
                ) {
                    return;
                }

                isDragging = true;

                touchStartX =
                    event.touches[0].clientX;

                touchCurrentX =
                    touchStartX;


                mobileStage.style.transition =
                    "none";

            },
            {
                passive: true
            }
        );


        mobileViewport.addEventListener(
            "touchmove",
            event => {

                if (!isDragging) {
                    return;
                }

                touchCurrentX =
                    event.touches[0].clientX;


                const delta =
                    touchCurrentX -
                    touchStartX;


                /*
                 * Während des Swipes bewegen wir
                 * den gesamten Stage.
                 */

                const currentTransform =
                    getComputedStyle(
                        mobileStage
                    ).transform;


                /*
                 * Einfaches Follow-the-finger:
                 *
                 * Die tatsächliche Zielposition
                 * wird beim Loslassen gesetzt.
                 *
                 * Dadurch bleibt die Bewegung
                 * stabil und springt nicht.
                 */

                mobileStage.style.transform =
                    `translate3d(
                        ${delta}px,
                        -50%,
                        0
                    )`;

            },
            {
                passive: true
            }
        );


        /* =========================================================
           SWIPE ENDE
        ========================================================= */

        mobileViewport.addEventListener(
            "touchend",
            () => {

                if (!isDragging) {
                    return;
                }

                isDragging = false;


                const delta =
                    touchCurrentX -
                    touchStartX;


                const threshold =
                    Math.min(
                        70,
                        window.innerWidth * 0.18
                    );


                /*
                 * NACH LINKS
                 */

                if (
                    delta < -threshold &&
                    mobilePosition <
                    maxPage * 2 - 1
                ) {

                    mobilePosition++;

                }


                /*
                 * NACH RECHTS
                 */

                else if (
                    delta > threshold &&
                    mobilePosition > 0
                ) {

                    mobilePosition--;

                }


                updateMobilePosition(true);

            }
        );


        /* =========================================================
           TOUCH CANCEL
        ========================================================= */

        mobileViewport.addEventListener(
            "touchcancel",
            () => {

                if (!isDragging) {
                    return;
                }

                isDragging = false;

                updateMobilePosition(true);

            }
        );


        /* =========================================================
           DESKTOP TASTATUR
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "ArrowLeft" &&
                    currentPage > 1
                ) {

                    showImage(
                        currentPage - 1
                    );

                }


                if (
                    event.key === "ArrowRight" &&
                    currentPage < maxPage
                ) {

                    showImage(
                        currentPage + 1
                    );

                }

            }
        );


        /* =========================================================
           RESIZE
        ========================================================= */

        window.addEventListener(
            "resize",
            () => {

                if (
                    window.innerWidth <= 800
                ) {

                    updateMobilePosition(false);

                }

            }
        );


        /* =========================================================
           START
        ========================================================= */

        findImages();

    </script>

</body>
</html>
