
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .portfolio {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 0;

            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pdf-page {
            width: 100%;
            aspect-ratio: 297 / 210;
            position: relative;
            background: #ffffff;
            overflow: hidden;
        }

        .pdf-page canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .error {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .portfolio {
                width: 100%;
                max-width: none;
                padding: 0;
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <main id="portfolio" class="portfolio"></main>

    <script type="module">
        import * as pdfjsLib from
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

        const FOLDER = "images/";
        const TOTAL_PAGES = 23;

        const container = document.getElementById("portfolio");

        const pages = [];
        const observerOptions = {
            root: null,
            rootMargin: "800px 0px",
            threshold: 0
        };

        // Create placeholders for all 23 pages.
        for (let i = 1; i <= TOTAL_PAGES; i++) {
            const pageNumber = String(i).padStart(2, "0");

            const page = document.createElement("section");
            page.className = "pdf-page";
            page.dataset.src = `${FOLDER}${pageNumber}.pdf`;
            page.setAttribute(
                "aria-label",
                `Portfolio Seite ${i}`
            );

            container.appendChild(page);
            pages.push(page);
        }

        const loadedDocuments = new Map();
        const activeRenders = new Map();

        async function renderPage(element) {
            if (element.dataset.loaded === "true" ||
                element.dataset.loading === "true") {
                return;
            }

            element.dataset.loading = "true";

            try {
                const loadingTask = pdfjsLib.getDocument({
                    url: element.dataset.src
                });

                const pdf = await loadingTask.promise;
                loadedDocuments.set(element, pdf);

                const page = await pdf.getPage(1);

                const baseViewport = page.getViewport({
                    scale: 1
                });

                const cssWidth = element.clientWidth;
                const scale = cssWidth / baseViewport.width;

                // Limit resolution for mobile performance.
                const pixelRatio = Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

                const viewport = page.getViewport({
                    scale: scale * pixelRatio
                });

                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d", {
                    alpha: false
                });

                canvas.width = Math.ceil(viewport.width);
                canvas.height = Math.ceil(viewport.height);

                canvas.style.width = "100%";
                canvas.style.height = "100%";

                element.replaceChildren(canvas);

                const renderTask = page.render({
                    canvasContext: context,
                    viewport
                });

                activeRenders.set(element, renderTask);

                await renderTask.promise;

                element.dataset.loaded = "true";
                activeRenders.delete(element);

                page.cleanup();

            } catch (error) {
                console.error(
                    "Fehler beim Laden:",
                    element.dataset.src,
                    error
                );

                element.innerHTML =
                    '<div class="error">Seite konnte nicht geladen werden.</div>';

                element.dataset.error = "true";

            } finally {
                element.dataset.loading = "false";
            }
        }

        // Render pages as they approach the viewport.
        const observer = new IntersectionObserver(
            (entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting) {
                        observer.unobserve(entry.target);
                        renderPage(entry.target);
                    }
                }
            },
            observerOptions
        );

        pages.forEach(page => observer.observe(page));
    </script>

</body>
</html>
