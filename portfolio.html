
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Desktop */
        .portfolio {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 0;
        }

        .pdf-viewer {
            display: block;
            width: 100%;
            height: calc(100dvh - 24px);
            border: none;
            background: white;
        }

        /* Handy */
        @media (max-width: 600px) {
            .portfolio {
                width: 100%;
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .pdf-viewer {
                width: 100%;
                height: 100dvh;
            }
        }
    </style>
</head>

<body>

    <main class="portfolio">
        <iframe
            class="pdf-viewer"
            src="images/portfolio.pdf#toolbar=0&navpanes=0&scrollbar=1&view=FitH"
            title="Portfolio"
        ></iframe>
    </main>

</body>
</html>
