
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .portfolio {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 0;

            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pdf-page {
            width: 100%;
            aspect-ratio: 297 / 210;
            position: relative;
            background: #ffffff;
            overflow: hidden;
        }

        .pdf-page canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .error {
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .portfolio {
                width: 100%;
                max-width: none;
                padding: 0;
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <main id="portfolio" class="portfolio"></main>

    <script type="module">
        import * as pdfjsLib from
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

        // Single PDF containing all pages
        const PDF_FILE = "images/portfolio.pdf";

        const container = document.getElementById("portfolio");

        const pixelRatio = Math.min(
            window.devicePixelRatio || 1,
            2
        );

        async function initPortfolio() {
            try {
                const loadingTask = pdfjsLib.getDocument({
                    url: PDF_FILE
                });

                const pdf = await loadingTask.promise;

                const totalPages = pdf.numPages;

                const observer = new IntersectionObserver(
                    (entries) => {
                        for (const entry of entries) {
                            if (entry.isIntersecting) {
                                observer.unobserve(entry.target);

                                renderPage(
                                    pdf,
                                    Number(entry.target.dataset.page),
                                    entry.target
                                );
                            }
                        }
                    },
                    {
                        root: null,
                        rootMargin: "800px 0px",
                        threshold: 0
                    }
                );

                // Automatically create all pages
                for (let i = 1; i <= totalPages; i++) {
                    const element = document.createElement("section");

                    element.className = "pdf-page";
                    element.dataset.page = i;

                    element.setAttribute(
                        "aria-label",
                        `Portfolio Seite ${i}`
                    );

                    container.appendChild(element);
                    observer.observe(element);
                }

            } catch (error) {
                console.error("PDF konnte nicht geladen werden:", error);

                container.innerHTML =
                    '<div class="error">Portfolio konnte nicht geladen werden.</div>';
            }
        }

        async function renderPage(pdf, pageNumber, element) {
            if (element.dataset.loading === "true" ||
                element.dataset.loaded === "true") {
                return;
            }

            element.dataset.loading = "true";

            try {
                const page = await pdf.getPage(pageNumber);

                const baseViewport = page.getViewport({
                    scale: 1
                });

                const cssWidth = element.clientWidth;

                const scale = cssWidth / baseViewport.width;

                const viewport = page.getViewport({
                    scale: scale * pixelRatio
                });

                const canvas = document.createElement("canvas");

                const context = canvas.getContext("2d", {
                    alpha: false
                });

                canvas.width = Math.ceil(viewport.width);
                canvas.height = Math.ceil(viewport.height);

                canvas.style.width = "100%";
                canvas.style.height = "100%";

                element.replaceChildren(canvas);

                const renderTask = page.render({
                    canvasContext: context,
                    viewport: viewport
                });

                await renderTask.promise;

                element.dataset.loaded = "true";

                page.cleanup();

            } catch (error) {
                console.error(
                    `Fehler bei Seite ${pageNumber}:`,
                    error
                );

                element.innerHTML =
                    '<div class="error">Seite konnte nicht geladen werden.</div>';

            } finally {
                element.dataset.loading = "false";
            }
        }

        initPortfolio();
    </script>

</body>
</html>
