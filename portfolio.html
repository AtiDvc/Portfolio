<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #ffffff;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           DESKTOP
        ========================= */

        .portfolio {
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sheet {
            position: relative;

            width: min(84vw, 1200px);
            aspect-ratio: 297 / 210;

            background: #ffffff;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: visible;
        }


        /* =========================
           BILD
        ========================= */

        #portfolioImage {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: none;
        }

        #portfolioImage.visible {
            display: block;
        }


        /* =========================
           DESKTOP PFEILE
        ========================= */

        .arrow {
            position: absolute;

            top: 50%;

            width: 30px;
            height: 50px;

            padding: 0;
            margin: 0;

            border: none;
            outline: none;

            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transform: translateY(-50%);

            z-index: 10;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }

        .arrow:hover {
            opacity: 0.6;
        }

        .arrow:focus,
        .arrow:focus-visible,
        .arrow:active {
            outline: none;
            border: none;
            box-shadow: none;
        }

        .arrow svg {
            width: 18px;
            height: 32px;
            display: block;
        }

        .arrow-left {
            left: -55px;
        }

        .arrow-left svg {
            transform: rotate(180deg);
        }

        .arrow-left:hover {
            transform: translate(-5px, -50%);
        }

        .arrow-right {
            right: -55px;
        }

        .arrow-right:hover {
            transform: translate(5px, -50%);
        }

        .arrow.disabled {
            opacity: 0.15;
            pointer-events: none;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            /*
             * Auf Mobile wird das Desktop-System
             * komplett ersetzt.
             */

            .portfolio {
                width: 100vw;
                height: 100svh;

                display: flex;
                align-items: center;
                justify-content: center;

                overflow: hidden;
            }


            /* =========================
               MOBILE VIEWPORT
            ========================= */

            .mobile-viewport {
                position: relative;

                width: 100vw;
                height: 100svh;

                overflow: hidden;

                touch-action: pan-y;
            }


            /* =========================
               MOBILE TRACK
            ========================= */

            .mobile-track {
                position: absolute;

                top: 50%;
                left: 0;

                height: min(100vw * 210 / 297, 88svh);

                width: auto;

                display: flex;
                align-items: center;

                transform:
                    translate(
                        0,
                        -50%
                    );

                will-change: transform;
            }


            /* =========================
               MOBILE SEITE
            ========================= */

            .mobile-page {
                position: relative;

                width: 100vw;
                height: 100%;

                flex-shrink: 0;

                display: flex;
                align-items: center;
                justify-content: center;

                overflow: hidden;
            }


            /*
             * Das eigentliche A4-Bild.
             *
             * Es ist doppelt so breit wie
             * der sichtbare Bereich.
             */

            .mobile-page img {
                position: absolute;

                top: 50%;

                width: 200vw;
                height: auto;

                max-width: none;

                transform:
                    translateY(-50%);

                display: block;

                user-select: none;
                -webkit-user-drag: none;

                pointer-events: none;
            }


            /*
             * Linke Hälfte
             */

            .mobile-page.left img {
                left: 0;
            }


            /*
             * Rechte Hälfte
             */

            .mobile-page.right img {
                left: -100vw;
            }


            /* =========================
               DESKTOP ELEMENTE AUSBLENDEN
            ========================= */

            .sheet {
                display: none;
            }
        }
    </style>
</head>


<body>

    <main class="portfolio">

        <!-- =========================
             DESKTOP
        ========================= -->

        <div class="sheet">

            <img
                id="portfolioImage"
                alt="Portfolio"
            >

            <button
                id="prevButton"
                class="arrow arrow-left disabled"
                aria-label="Vorherige Seite"
            >
                <svg
                    viewBox="0 0 462.45 818.53"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <polygon
                        fill="#1d1d1b"
                        points="
                            462.3 409.25
                            462.41 409.14
                            53.27 0
                            0 53.27
                            356.01 409.28
                            .04 765.26
                            53.31 818.53
                            462.45 409.39
                            462.3 409.25
                        "
                    />
                </svg>
            </button>

            <button
                id="nextButton"
                class="arrow arrow-right disabled"
                aria-label="Nächste Seite"
            >
                <svg
                    viewBox="0 0 462.45 818.53"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <polygon
                        fill="#1d1d1b"
                        points="
                            462.3 409.25
                            462.41 409.14
                            53.27 0
                            0 53.27
                            356.01 409.28
                            .04 765.26
                            53.31 818.53
                            462.45 409.39
                            462.3 409.25
                        "
                    />
                </svg>
            </button>

        </div>


        <!-- =========================
             MOBILE
        ========================= -->

        <div
            class="mobile-viewport"
            id="mobileViewport"
        >

            <div
                class="mobile-track"
                id="mobileTrack"
            ></div>

        </div>

    </main>


    <script>

        /* =========================
           ELEMENTE
        ========================= */

        const image =
            document.getElementById(
                "portfolioImage"
            );

        const prevButton =
            document.getElementById(
                "prevButton"
            );

        const nextButton =
            document.getElementById(
                "nextButton"
            );

        const mobileTrack =
            document.getElementById(
                "mobileTrack"
            );

        const mobileViewport =
            document.getElementById(
                "mobileViewport"
            );


        /* =========================
           ORDNER
        ========================= */

        const IMAGE_FOLDER =
            "images/portfolio";


        /* =========================
           VARIABLEN
        ========================= */

        let currentPage = 1;
        let maxPage = 0;

        /*
         * Mobile Position:
         *
         * 0 = Seite 1 links
         * 1 = Seite 1 rechts
         * 2 = Seite 2 links
         * 3 = Seite 2 rechts
         */

        let mobilePosition = 0;


        /* =========================
           BILD EXISTIERT?
        ========================= */

        function checkImage(number) {

            return new Promise(resolve => {

                const testImage =
                    new Image();

                testImage.onload =
                    () => resolve(true);

                testImage.onerror =
                    () => resolve(false);

                testImage.src =
                    `${IMAGE_FOLDER}/${number}.png`;

            });

        }


        /* =========================
           ALLE PNGs FINDEN
        ========================= */

        async function findImages() {

            maxPage = 0;

            for (
                let number = 1;
                number <= 100;
                number++
            ) {

                const exists =
                    await checkImage(number);

                if (!exists) {
                    break;
                }

                maxPage = number;
            }


            if (maxPage === 0) {

                updateButtons();

                return;
            }


            /*
             * Desktop
             */

            showImage(1);


            /*
             * Mobile
             */

            createMobilePages();

        }


        /* =========================
           DESKTOP BILD
        ========================= */

        function showImage(number) {

            if (
                number < 1 ||
                number > maxPage
            ) {
                return;
            }

            currentPage = number;

            image.src =
                `${IMAGE_FOLDER}/${number}.png`;

            image.classList.add(
                "visible"
            );

            updateButtons();

        }


        /* =========================
           DESKTOP PFEILE
        ========================= */

        function updateButtons() {

            if (maxPage === 0) {

                prevButton.classList.add(
                    "disabled"
                );

                nextButton.classList.add(
                    "disabled"
                );

                return;
            }


            if (currentPage <= 1) {

                prevButton.classList.add(
                    "disabled"
                );

            } else {

                prevButton.classList.remove(
                    "disabled"
                );

            }


            if (
                currentPage >= maxPage
            ) {

                nextButton.classList.add(
                    "disabled"
                );

            } else {

                nextButton.classList.remove(
                    "disabled"
                );

            }

        }


        /* =========================
           DESKTOP ZURÜCK
        ========================= */

        prevButton.addEventListener(
            "click",
            () => {

                if (
                    currentPage > 1
                ) {

                    showImage(
                        currentPage - 1
                    );

                }

            }
        );


        /* =========================
           DESKTOP WEITER
        ========================= */

        nextButton.addEventListener(
            "click",
            () => {

                if (
                    currentPage < maxPage
                ) {

                    showImage(
                        currentPage + 1
                    );

                }

            }
        );


        /* =========================
           MOBILE SEITEN ERSTELLEN
        ========================= */

        function createMobilePages() {

            mobileTrack.innerHTML = "";

            for (
                let page = 1;
                page <= maxPage;
                page++
            ) {

                /*
                 * Linke Hälfte
                 */

                const left =
                    document.createElement(
                        "div"
                    );

                left.className =
                    "mobile-page left";

                left.innerHTML = `
                    <img
                        src="${IMAGE_FOLDER}/${page}.png"
                        alt="Portfolio Seite ${page}"
                        draggable="false"
                    >
                `;

                mobileTrack.appendChild(
                    left
                );


                /*
                 * Rechte Hälfte
                 */

                const right =
                    document.createElement(
                        "div"
                    );

                right.className =
                    "mobile-page right";

                right.innerHTML = `
                    <img
                        src="${IMAGE_FOLDER}/${page}.png"
                        alt="Portfolio Seite ${page}"
                        draggable="false"
                    >
                `;

                mobileTrack.appendChild(
                    right
                );

            }


            mobilePosition = 0;

            updateMobilePosition(
                false
            );

        }


        /* =========================
           MOBILE POSITION
        ========================= */

        function updateMobilePosition(
            animate = true
        ) {

            const width =
                window.innerWidth;

            if (!animate) {

                mobileTrack.style.transition =
                    "none";

            } else {

                mobileTrack.style.transition =
                    "transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1)";

            }


            mobileTrack.style.transform =
                `translate(
                    ${-mobilePosition * width}px,
                    -50%
                )`;

        }


        /* =========================
           MOBILE SWIPE
        ========================= */

        let touchStartX = 0;
        let touchCurrentX = 0;

        let isDragging = false;


        mobileViewport.addEventListener(
            "touchstart",
            event => {

                if (
                    event.touches.length !== 1
                ) {
                    return;
                }

                isDragging = true;

                touchStartX =
                    event.touches[0].clientX;

                touchCurrentX =
                    touchStartX;


                mobileTrack.style.transition =
                    "none";

            },
            {
                passive: true
            }
        );


        mobileViewport.addEventListener(
            "touchmove",
            event => {

                if (!isDragging) {
                    return;
                }

                touchCurrentX =
                    event.touches[0].clientX;

                const delta =
                    touchCurrentX -
                    touchStartX;

                const width =
                    window.innerWidth;

                const basePosition =
                    -mobilePosition * width;

                /*
                 * Track folgt dem Finger.
                 */

                mobileTrack.style.transform =
                    `translate(
                        ${basePosition + delta}px,
                        -50%
                    )`;

            },
            {
                passive: true
            }
        );


        mobileViewport.addEventListener(
            "touchend",
            () => {

                if (!isDragging) {
                    return;
                }

                isDragging = false;

                const delta =
                    touchCurrentX -
                    touchStartX;

                const threshold =
                    Math.min(
                        80,
                        window.innerWidth * 0.18
                    );


                /*
                 * Swipe nach links
                 */

                if (
                    delta < -threshold &&
                    mobilePosition <
                    maxPage * 2 - 1
                ) {

                    mobilePosition++;

                }


                /*
                 * Swipe nach rechts
                 */

                else if (
                    delta > threshold &&
                    mobilePosition > 0
                ) {

                    mobilePosition--;

                }


                /*
                 * Zur aktuellen Position
                 */

                updateMobilePosition(
                    true
                );

            }
        );


        /* =========================
           TOUCH ABGEBROCHEN
        ========================= */

        mobileViewport.addEventListener(
            "touchcancel",
            () => {

                if (!isDragging) {
                    return;
                }

                isDragging = false;

                updateMobilePosition(
                    true
                );

            }
        );


        /* =========================
           DESKTOP TASTATUR
        ========================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "ArrowLeft" &&
                    currentPage > 1
                ) {

                    showImage(
                        currentPage - 1
                    );

                }


                if (
                    event.key === "ArrowRight" &&
                    currentPage < maxPage
                ) {

                    showImage(
                        currentPage + 1
                    );

                }

            }
        );


        /* =========================
           FENSTERGRÖSSE
        ========================= */

        window.addEventListener(
            "resize",
            () => {

                if (
                    window.innerWidth <= 800
                ) {

                    updateMobilePosition(
                        false
                    );

                }

            }
        );


        /* =========================
           START
        ========================= */

        findImages();

    </script>

</body>
</html>
