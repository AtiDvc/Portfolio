<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================================================
           DESKTOP
           ========================================================= */

        .desktop-portfolio {
            width: 100%;
            height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;
        }

        .desktop-viewer {
            width: min(84vw, 1200px);
            aspect-ratio: 297 / 210;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .desktop-sheet {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.14);
        }

        .desktop-arrow {
            position: absolute;

            top: 50%;
            transform: translateY(-50%);

            width: 60px;
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            margin: 0;

            border: none;
            background: transparent;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                opacity 0.2s ease;
        }

        .desktop-arrow svg {
            width: 18px;
            height: auto;
            display: block;
        }

        .desktop-arrow.left {
            right: calc(100% + 35px);
        }

        .desktop-arrow.right {
            left: calc(100% + 35px);
        }

        .desktop-arrow.left:hover {
            transform: translateY(-50%) translateX(-7px);
        }

        .desktop-arrow.right:hover {
            transform: translateY(-50%) translateX(7px);
        }

        .desktop-arrow.disabled {
            opacity: 0.15;
            pointer-events: none;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        .mobile-portfolio {
            display: none;
        }


        /* =========================================================
           MOBILE BREAKPOINT
           ========================================================= */

        @media (max-width: 600px) {

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
            }

            .desktop-portfolio {
                display: none;
            }

            .mobile-portfolio {
                display: block;

                position: relative;

                width: 100%;
                height: 100svh;

                overflow: hidden;

                touch-action: pan-y;
                user-select: none;
                -webkit-user-select: none;
            }

            /*
             * Die A4-Seite ist absichtlich ca. 150vw breit.
             *
             * Dadurch sieht man auf dem Handy etwas mehr als
             * die Hälfte der A4-Seite.
             *
             * A4:
             * 297 / 210 = 1.414285...
             *
             * 150vw / 1.414 = 106.06vw Höhe
             */
            .mobile-stage {
                position: absolute;

                left: 0;
                top: 50%;

                height: min(106.06vw, 78svh);

                display: flex;
                align-items: stretch;

                will-change: transform;

                transform: translate3d(0, -50%, 0);

                transition:
                    transform 420ms cubic-bezier(0.22, 0.61, 0.36, 1);
            }

            /*
             * WICHTIG:
             * Jede PNG existiert hier nur EINMAL.
             */
            .mobile-sheet {
                flex: 0 0 auto;

                height: 100%;
                width: auto;

                aspect-ratio: 297 / 210;

                display: block;

                object-fit: contain;

                box-shadow:
                    0 14px 35px rgba(0, 0, 0, 0.15);
            }

            .mobile-sheet img {
                width: 100%;
                height: 100%;

                display: block;

                object-fit: contain;
            }
        }
    </style>
</head>


<body>

    <!-- =========================================================
         DESKTOP
         ========================================================= -->

    <main class="desktop-portfolio">

        <div class="desktop-viewer">

            <button
                class="desktop-arrow left disabled"
                id="desktopPrev"
                aria-label="Vorherige Seite"
            >
                <svg
                    viewBox="0 0 462.45 818.53"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <polygon
                        fill="#1d1d1b"
                        points="
                            462.3 409.25
                            462.41 409.14
                            53.27 0
                            0 53.27
                            356.01 409.28
                            .04 765.26
                            53.31 818.53
                            462.45 409.39
                            462.3 409.25
                        "
                    />
                </svg>
            </button>


            <img
                id="desktopSheet"
                class="desktop-sheet"
                src="images/portfolio/1.png"
                alt="Portfolio Seite 1"
            >


            <button
                class="desktop-arrow right"
                id="desktopNext"
                aria-label="Nächste Seite"
            >
                <svg
                    viewBox="0 0 462.45 818.53"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <polygon
                        fill="#1d1d1b"
                        points="
                            462.3 409.25
                            462.41 409.14
                            53.27 0
                            0 53.27
                            356.01 409.28
                            .04 765.26
                            53.31 818.53
                            462.45 409.39
                            462.3 409.25
                        "
                    />
                </svg>
            </button>

        </div>

    </main>



    <!-- =========================================================
         MOBILE
         ========================================================= -->

    <main
        class="mobile-portfolio"
        id="mobilePortfolio"
    >

        <div
            class="mobile-stage"
            id="mobileStage"
        ></div>

    </main>



    <script>

        /* =========================================================
           SETTINGS
           ========================================================= */

        const IMAGE_FOLDER = "images/portfolio/";

        /*
         * Wir suchen automatisch:
         *
         * 1.png
         * 2.png
         * 3.png
         * ...
         *
         * Sobald eine Nummer fehlt, wird aufgehört.
         */
        let maxPage = 0;


        /* =========================================================
           FIND AVAILABLE PAGES
           ========================================================= */

        async function findPages() {

            let page = 1;

            while (true) {

                const exists = await checkImage(
                    `${IMAGE_FOLDER}${page}.png`
                );

                if (!exists) {
                    break;
                }

                maxPage = page;
                page++;
            }

            if (maxPage === 0) {
                console.error("Keine Portfolio-Bilder gefunden.");
                return;
            }

            initializePortfolio();
        }


        function checkImage(src) {

            return new Promise((resolve) => {

                const img = new Image();

                img.onload = () => resolve(true);

                img.onerror = () => resolve(false);

                img.src = src;
            });
        }



        /* =========================================================
           STATE
           ========================================================= */

        let currentPage = 1;

        /*
         * Desktop:
         * eine Seite pro Klick
         *
         * Mobile:
         *
         * 0 = Seite 1 links
         * 1 = Seite 1 rechts
         * 2 = Seite 2 links
         * 3 = Seite 2 rechts
         * usw.
         */
        let mobileState = 0;



        /* =========================================================
           DESKTOP
           ========================================================= */

        const desktopSheet =
            document.getElementById("desktopSheet");

        const desktopPrev =
            document.getElementById("desktopPrev");

        const desktopNext =
            document.getElementById("desktopNext");


        function updateDesktop() {

            desktopSheet.src =
                `${IMAGE_FOLDER}${currentPage}.png`;

            desktopSheet.alt =
                `Portfolio Seite ${currentPage}`;

            desktopPrev.classList.toggle(
                "disabled",
                currentPage === 1
            );

            desktopNext.classList.toggle(
                "disabled",
                currentPage === maxPage
            );
        }


        desktopPrev.addEventListener(
            "click",
            () => {

                if (currentPage <= 1) {
                    return;
                }

                currentPage--;

                updateDesktop();
            }
        );


        desktopNext.addEventListener(
            "click",
            () => {

                if (currentPage >= maxPage) {
                    return;
                }

                currentPage++;

                updateDesktop();
            }
        );



        /* =========================================================
           DESKTOP KEYBOARD
           ========================================================= */

        document.addEventListener(
            "keydown",
            (event) => {

                /*
                 * Nicht reagieren, wenn jemand gerade
                 * in einem Eingabefeld ist.
                 */
                const tag =
                    document.activeElement?.tagName;

                if (
                    tag === "INPUT" ||
                    tag === "TEXTAREA" ||
                    tag === "SELECT"
                ) {
                    return;
                }


                if (event.key === "ArrowLeft") {

                    if (currentPage > 1) {

                        currentPage--;

                        updateDesktop();
                    }
                }


                if (event.key === "ArrowRight") {

                    if (currentPage < maxPage) {

                        currentPage++;

                        updateDesktop();
                    }
                }
            }
        );



        /* =========================================================
           MOBILE ELEMENTE ERZEUGEN
           ========================================================= */

        const mobileStage =
            document.getElementById("mobileStage");


        function createMobilePages() {

            mobileStage.innerHTML = "";

            /*
             * WICHTIG:
             *
             * Genau EINE .mobile-sheet
             * pro PNG.
             *
             * KEINE linke + rechte Kopie.
             */

            for (
                let page = 1;
                page <= maxPage;
                page++
            ) {

                const sheet =
                    document.createElement("div");

                sheet.className =
                    "mobile-sheet";


                const image =
                    document.createElement("img");

                image.src =
                    `${IMAGE_FOLDER}${page}.png`;

                image.alt =
                    `Portfolio Seite ${page}`;

                image.draggable = false;


                sheet.appendChild(image);

                mobileStage.appendChild(sheet);
            }
        }



        /* =========================================================
           MOBILE POSITION BERECHNUNG
           ========================================================= */

        function getMobilePosition(state) {

            const viewportWidth =
                window.innerWidth;


            /*
             * Die tatsächliche Seitenhöhe.
             *
             * Dieselbe Formel wie im CSS:
             *
             * height = min(106.06vw, 78svh)
             */
            const pageHeight =
                Math.min(
                    viewportWidth * 1.0606,
                    window.innerHeight * 0.78
                );


            /*
             * A4-Breite:
             *
             * 297 / 210
             */
            const pageWidth =
                pageHeight * (297 / 210);


            /*
             * Welche Seite?
             *
             * state:
             *
             * 0 -> Seite 1 links
             * 1 -> Seite 1 rechts
             * 2 -> Seite 2 links
             * 3 -> Seite 2 rechts
             */
            const pageIndex =
                Math.floor(state / 2);


            const side =
                state % 2;


            /*
             * Kleiner Rand links/rechts.
             */
            const margin =
                viewportWidth * 0.04;


            /*
             * Position der gewünschten Seite
             * innerhalb des gesamten Tracks.
             */
            const pageStart =
                pageIndex * pageWidth;


            let x;


            if (side === 0) {

                /*
                 * LINKER BEREICH
                 *
                 * Die linke Seite des A4-Blattes
                 * beginnt ungefähr 4vw vom linken
                 * Bildschirmrand.
                 */
                x =
                    margin - pageStart;

            } else {

                /*
                 * RECHTER BEREICH
                 *
                 * Die rechte Seite des A4-Blattes
                 * liegt ungefähr 4vw vom rechten
                 * Bildschirmrand entfernt.
                 */
                x =
                    viewportWidth
                    - margin
                    - pageWidth
                    - pageStart;
            }


            return x;
        }



        /* =========================================================
           MOBILE POSITION SETZEN
           ========================================================= */

        function setMobileState(
            state,
            animate = true
        ) {

            /*
             * Grenzen.
             */
            const maxState =
                maxPage * 2 - 1;


            mobileState =
                Math.max(
                    0,
                    Math.min(state, maxState)
                );


            const x =
                getMobilePosition(mobileState);


            if (animate) {

                mobileStage.style.transition =
                    "transform 420ms cubic-bezier(0.22, 0.61, 0.36, 1)";

            } else {

                mobileStage.style.transition =
                    "none";
            }


            /*
             * WICHTIG:
             *
             * translate3d bekommt immer die
             * KOMPLETTE berechnete Position.
             *
             * Dadurch kann der Track während eines
             * Swipes nicht versehentlich seine
             * Ausgangsposition verlieren.
             */
            mobileStage.style.transform =
                `translate3d(${x}px, -50%, 0)`;
        }



        /* =========================================================
           MOBILE SWIPE
           ========================================================= */

        let touchStartX = 0;

        let touchStartY = 0;

        let touchStartPosition = 0;

        let isDragging = false;

        let hasMoved = false;


        const mobilePortfolio =
            document.getElementById("mobilePortfolio");


        mobilePortfolio.addEventListener(
            "touchstart",
            (event) => {

                if (
                    !event.touches ||
                    event.touches.length !== 1
                ) {
                    return;
                }


                touchStartX =
                    event.touches[0].clientX;

                touchStartY =
                    event.touches[0].clientY;


                touchStartPosition =
                    getMobilePosition(mobileState);


                isDragging = true;

                hasMoved = false;


                mobileStage.style.transition =
                    "none";
            },
            {
                passive: true
            }
        );



        mobilePortfolio.addEventListener(
            "touchmove",
            (event) => {

                if (!isDragging) {
                    return;
                }


                if (
                    !event.touches ||
                    event.touches.length !== 1
                ) {
                    return;
                }


                const currentX =
                    event.touches[0].clientX;

                const currentY =
                    event.touches[0].clientY;


                const deltaX =
                    currentX - touchStartX;

                const deltaY =
                    currentY - touchStartY;


                /*
                 * Wenn die Bewegung stärker vertikal
                 * als horizontal ist, lassen wir Safari
                 * die normale vertikale Geste behandeln.
                 */
                if (
                    Math.abs(deltaY) >
                    Math.abs(deltaX)
                ) {
                    return;
                }


                hasMoved = true;


                /*
                 * Während des Ziehens bewegen wir
                 * die Seite direkt.
                 */
                mobileStage.style.transform =
                    `translate3d(
                        ${touchStartPosition + deltaX}px,
                        -50%,
                        0
                    )`;
            },
            {
                passive: true
            }
        );



        mobilePortfolio.addEventListener(
            "touchend",
            (event) => {

                if (!isDragging) {
                    return;
                }


                isDragging = false;


                const endX =
                    event.changedTouches[0].clientX;


                const deltaX =
                    endX - touchStartX;


                /*
                 * Mindestdistanz für einen Swipe.
                 */
                const threshold =
                    Math.max(
                        45,
                        window.innerWidth * 0.12
                    );


                if (
                    Math.abs(deltaX) >= threshold
                ) {

                    if (deltaX < 0) {

                        /*
                         * Nach links wischen:
                         * nächster Zustand
                         */
                        setMobileState(
                            mobileState + 1,
                            true
                        );

                    } else {

                        /*
                         * Nach rechts wischen:
                         * vorheriger Zustand
                         */
                        setMobileState(
                            mobileState - 1,
                            true
                        );
                    }

                } else {

                    /*
                     * Kein richtiger Swipe:
                     * zurück zur aktuellen Position.
                     */
                    setMobileState(
                        mobileState,
                        true
                    );
                }
            },
            {
                passive: true
            }
        );



        /* =========================================================
           MOBILE RESIZE / ORIENTATION
           ========================================================= */

        let resizeTimer;


        window.addEventListener(
            "resize",
            () => {

                clearTimeout(resizeTimer);


                resizeTimer =
                    setTimeout(
                        () => {

                            setMobileState(
                                mobileState,
                                false
                            );

                        },
                        100
                    );
            }
        );



        /* =========================================================
           INITIALIZE
           ========================================================= */

        function initializePortfolio() {

            updateDesktop();

            createMobilePages();

            /*
             * Start:
             * Seite 1 linker Bereich.
             */
            setMobileState(
                0,
                false
            );
        }


        /* =========================================================
           START
           ========================================================= */

        findPages();

    </script>

</body>
</html>
