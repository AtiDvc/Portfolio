<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Portfolio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================================
           DESKTOP
           ========================================================= */

        .desktop-portfolio {
            width: 100%;
            height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .desktop-viewer {
            width: min(84vw, 1200px);
            aspect-ratio: 297 / 210;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .desktop-sheet {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.14);
        }


        /* Desktop Pfeile */

        .desktop-arrow {
            position: absolute;

            top: 50%;

            width: 60px;
            height: 90px;

            padding: 0;
            margin: 0;

            border: 0;
            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transform: translateY(-50%);

            transition:
                transform 0.25s ease,
                opacity 0.2s ease;
        }

        .desktop-arrow svg {
            width: 18px;
            height: auto;

            display: block;
        }

        .desktop-arrow.left {
            right: calc(100% + 35px);
        }

        .desktop-arrow.right {
            left: calc(100% + 35px);
        }

        .desktop-arrow.left:hover {
            transform:
                translateY(-50%)
                translateX(-7px);
        }

        .desktop-arrow.right:hover {
            transform:
                translateY(-50%)
                translateX(7px);
        }

        .desktop-arrow.disabled {
            opacity: 0.15;
            pointer-events: none;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        .mobile-portfolio {
            display: none;
        }


        @media (max-width: 600px) {

            html,
            body {
                width: 100%;
                height: 100%;

                overflow: hidden;

                overscroll-behavior: none;
            }

            .desktop-portfolio {
                display: none;
            }

            .mobile-portfolio {
                display: block;

                position: relative;

                width: 100%;
                height: 100svh;

                overflow: hidden;

                touch-action: pan-y;

                user-select: none;
                -webkit-user-select: none;
            }


            /*
             * Der sichtbare Bereich.
             *
             * Hier darf niemals eine zweite Seite
             * einfach daneben herumliegen.
             */
            .mobile-window {
                position: absolute;

                inset: 0;

                width: 100%;
                height: 100%;

                overflow: hidden;
            }


            /*
             * Container für die aktuell sichtbare Seite.
             *
             * Die Seite ist absichtlich größer als
             * der Bildschirm.
             */
            .mobile-page {
                position: absolute;

                top: 50%;

                height: min(127.27vw, 78svh);

                width: auto;

                aspect-ratio: 297 / 210;

                margin: 0;

                padding: 0;

                background: #ffffff;

                box-shadow:
                    0 14px 38px rgba(0, 0, 0, 0.16);

                transform:
                    translate3d(0, -50%, 0);

                will-change:
                    left,
                    transform;

                transition:
                    left 420ms cubic-bezier(
                        0.22,
                        0.61,
                        0.36,
                        1
                    );
            }


            .mobile-page img {
                display: block;

                width: 100%;
                height: 100%;

                object-fit: contain;

                pointer-events: none;

                -webkit-user-drag: none;
                user-select: none;
                -webkit-user-select: none;
            }


            /*
             * Während eines Swipes wird die Transition
             * kurz ausgeschaltet.
             */
            .mobile-page.dragging {
                transition: none;
            }


            /*
             * Zweite Seite wird nur während eines
             * tatsächlichen Seitenwechsels benötigt.
             *
             * Sie liegt dann exakt dort, wo die neue
             * Seite beginnen soll.
             */
            .mobile-page.next-page {
                transition:
                    left 420ms cubic-bezier(
                        0.22,
                        0.61,
                        0.36,
                        1
                    );
            }
        }

    </style>
</head>


<body>


    <!-- =========================================================
         DESKTOP
         ========================================================= -->

    <main class="desktop-portfolio">

        <div class="desktop-viewer">

            <button
                id="desktopPrev"
                class="desktop-arrow left disabled"
                aria-label="Vorherige Seite"
            >

                <svg
                    viewBox="0 0 462.45 818.53"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polygon
                        fill="#1d1d1b"
                        points="
                            462.3 409.25
                            462.41 409.14
                            53.27 0
                            0 53.27
                            356.01 409.28
                            .04 765.26
                            53.31 818.53
                            462.45 409.39
                            462.3 409.25
                        "
                    />

                </svg>

            </button>


            <img
                id="desktopSheet"
                class="desktop-sheet"
                src="images/portfolio/1.png"
                alt="Portfolio Seite 1"
            >


            <button
                id="desktopNext"
                class="desktop-arrow right"
                aria-label="Nächste Seite"
            >

                <svg
                    viewBox="0 0 462.45 818.53"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polygon
                        fill="#1d1d1b"
                        points="
                            462.3 409.25
                            462.41 409.14
                            53.27 0
                            0 53.27
                            356.01 409.28
                            .04 765.26
                            53.31 818.53
                            462.45 409.39
                            462.3 409.25
                        "
                    />

                </svg>

            </button>

        </div>

    </main>



    <!-- =========================================================
         MOBILE
         ========================================================= -->

    <main
        id="mobilePortfolio"
        class="mobile-portfolio"
    >

        <div
            id="mobileWindow"
            class="mobile-window"
        >

            <div
                id="mobilePage"
                class="mobile-page"
            >

                <img
                    id="mobileImage"
                    src="images/portfolio/1.png"
                    alt="Portfolio Seite 1"
                    draggable="false"
                >

            </div>

        </div>

    </main>



    <script>

        /* =========================================================
           SETTINGS
           ========================================================= */

        const IMAGE_FOLDER =
            "images/portfolio/";


        /* =========================================================
           ELEMENTE
           ========================================================= */

        const desktopSheet =
            document.getElementById(
                "desktopSheet"
            );

        const desktopPrev =
            document.getElementById(
                "desktopPrev"
            );

        const desktopNext =
            document.getElementById(
                "desktopNext"
            );


        const mobileWindow =
            document.getElementById(
                "mobileWindow"
            );

        const mobilePage =
            document.getElementById(
                "mobilePage"
            );

        const mobileImage =
            document.getElementById(
                "mobileImage"
            );


        /* =========================================================
           PORTFOLIO SEITEN ERMITTELN
           ========================================================= */

        let maxPage = 0;


        function imageExists(src) {

            return new Promise((resolve) => {

                const image =
                    new Image();

                image.onload = () => {
                    resolve(true);
                };

                image.onerror = () => {
                    resolve(false);
                };

                image.src = src;
            });
        }


        async function findPages() {

            let page = 1;


            while (true) {

                const exists =
                    await imageExists(
                        `${IMAGE_FOLDER}${page}.png`
                    );


                if (!exists) {
                    break;
                }


                maxPage = page;

                page++;
            }


            if (maxPage === 0) {

                console.error(
                    "Keine Portfolio-Seiten gefunden."
                );

                return;
            }


            initialize();
        }



        /* =========================================================
           DESKTOP
           ========================================================= */

        let desktopPage = 1;


        function updateDesktop() {

            desktopSheet.src =
                `${IMAGE_FOLDER}${desktopPage}.png`;

            desktopSheet.alt =
                `Portfolio Seite ${desktopPage}`;


            desktopPrev.classList.toggle(
                "disabled",
                desktopPage === 1
            );


            desktopNext.classList.toggle(
                "disabled",
                desktopPage === maxPage
            );
        }


        desktopPrev.addEventListener(
            "click",
            () => {

                if (desktopPage <= 1) {
                    return;
                }

                desktopPage--;

                updateDesktop();
            }
        );


        desktopNext.addEventListener(
            "click",
            () => {

                if (desktopPage >= maxPage) {
                    return;
                }

                desktopPage++;

                updateDesktop();
            }
        );


        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "ArrowLeft" &&
                    desktopPage > 1
                ) {

                    desktopPage--;

                    updateDesktop();
                }


                if (
                    event.key === "ArrowRight" &&
                    desktopPage < maxPage
                ) {

                    desktopPage++;

                    updateDesktop();
                }
            }
        );



        /* =========================================================
           MOBILE
           ========================================================= */

        /*
         * mobilePage:
         *
         * 1 = Seite 1
         * 2 = Seite 2
         * ...
         */
        let mobileCurrentPage = 1;


        /*
         * 0 = linke Ansicht
         * 1 = rechte Ansicht
         */
        let mobileSide = 0;


        /*
         * Abstand vom Bildschirmrand.
         */
        const MOBILE_MARGIN = 0.04;



        /* =========================================================
           SEITENGRÖSSE
           ========================================================= */

        function getPageSize() {

            const viewportWidth =
                window.innerWidth;

            const viewportHeight =
                window.innerHeight;


            /*
             * Genau dieselbe Größe wie in CSS.
             */
            const height =
                Math.min(
                    viewportWidth * 1.0606,
                    viewportHeight * 0.78
                );


            const width =
                height *
                (297 / 210);


            return {
                width,
                height
            };
        }



        /* =========================================================
           POSITIONEN
           ========================================================= */

        function getLeftPosition() {

            const viewportWidth =
                window.innerWidth;

            return (
                viewportWidth *
                MOBILE_MARGIN
            );
        }


        function getRightPosition() {

            const viewportWidth =
                window.innerWidth;

            const pageSize =
                getPageSize();


            return (
                viewportWidth
                -
                viewportWidth *
                MOBILE_MARGIN
                -
                pageSize.width
            );
        }



        /* =========================================================
           AKTUELLE SEITE POSITIONIEREN
           ========================================================= */

        function setCurrentPosition(
            animate = true
        ) {

            if (!animate) {

                mobilePage.style.transition =
                    "none";

            } else {

                mobilePage.style.transition =
                    "left 420ms cubic-bezier(0.22, 0.61, 0.36, 1)";
            }


            const position =
                mobileSide === 0
                    ? getLeftPosition()
                    : getRightPosition();


            mobilePage.style.left =
                `${position}px`;


            /*
             * Nach einem "none"-Update wieder
             * normale Transition aktivieren.
             */
            if (!animate) {

                requestAnimationFrame(() => {

                    mobilePage.style.transition =
                        "left 420ms cubic-bezier(0.22, 0.61, 0.36, 1)";
                });
            }
        }



        /* =========================================================
           BILD WECHSELN
           ========================================================= */

        function setMobileImage(page) {

            mobileImage.src =
                `${IMAGE_FOLDER}${page}.png`;

            mobileImage.alt =
                `Portfolio Seite ${page}`;
        }



        /* =========================================================
           NEUE SEITE
           ========================================================= */

        function changeMobilePage(
            direction
        ) {

            if (
                direction > 0 &&
                mobileCurrentPage >= maxPage
            ) {
                return;
            }


            if (
                direction < 0 &&
                mobileCurrentPage <= 1
            ) {
                return;
            }


            /*
             * Die aktuelle Seite fährt komplett
             * aus dem Bildschirm.
             */
            const exitPosition =
                direction > 0
                    ? -getPageSize().width
                    : window.innerWidth;


            mobilePage.style.transition =
                "left 300ms cubic-bezier(0.4, 0, 1, 1)";


            mobilePage.style.left =
                `${exitPosition}px`;


            /*
             * Erst nachdem die alte Seite raus ist,
             * wird das PNG gewechselt.
             */
            setTimeout(() => {

                mobileCurrentPage +=
                    direction;


                /*
                 * Neue Seite startet auf der
                 * entsprechenden Seite.
                 *
                 * Nach links wischen:
                 * neue Seite beginnt links.
                 */
                mobileSide =
                    direction > 0
                        ? 0
                        : 1;


                setMobileImage(
                    mobileCurrentPage
                );


                /*
                 * Neue Seite zunächst außerhalb
                 * des Bildschirms platzieren.
                 */
                const startPosition =
                    direction > 0
                        ? window.innerWidth
                        : -getPageSize().width;


                mobilePage.style.transition =
                    "none";

                mobilePage.style.left =
                    `${startPosition}px`;


                /*
                 * Browser einen Frame geben.
                 */
                requestAnimationFrame(() => {

                    requestAnimationFrame(() => {

                        const targetPosition =
                            mobileSide === 0
                                ? getLeftPosition()
                                : getRightPosition();


                        mobilePage.style.transition =
                            "left 420ms cubic-bezier(0.22, 0.61, 0.36, 1)";


                        mobilePage.style.left =
                            `${targetPosition}px`;

                    });

                });

            }, 310);
        }



        /* =========================================================
           SWIPE
           ========================================================= */

        let touchStartX = 0;

        let touchStartY = 0;

        let touchCurrentX = 0;

        let isTouching = false;

        let isAnimating = false;



        mobileWindow.addEventListener(
            "touchstart",
            (event) => {

                if (
                    event.touches.length !== 1
                ) {
                    return;
                }


                if (isAnimating) {
                    return;
                }


                touchStartX =
                    event.touches[0].clientX;

                touchStartY =
                    event.touches[0].clientY;

                touchCurrentX =
                    touchStartX;


                isTouching = true;


                mobilePage.classList.add(
                    "dragging"
                );
            },
            {
                passive: true
            }
        );



        mobileWindow.addEventListener(
            "touchmove",
            (event) => {

                if (!isTouching) {
                    return;
                }


                if (
                    event.touches.length !== 1
                ) {
                    return;
                }


                touchCurrentX =
                    event.touches[0].clientX;


                const deltaX =
                    touchCurrentX -
                    touchStartX;


                const deltaY =
                    event.touches[0].clientY -
                    touchStartY;


                /*
                 * Nur horizontale Gesten.
                 */
                if (
                    Math.abs(deltaY) >
                    Math.abs(deltaX)
                ) {
                    return;
                }


                /*
                 * Aktuelle Position.
                 */
                const currentPosition =
                    mobileSide === 0
                        ? getLeftPosition()
                        : getRightPosition();


                /*
                 * Seite folgt dem Finger.
                 */
                mobilePage.style.left =
                    `${currentPosition + deltaX}px`;
            },
            {
                passive: true
            }
        );



        mobileWindow.addEventListener(
            "touchend",
            () => {

                if (!isTouching) {
                    return;
                }


                isTouching = false;


                mobilePage.classList.remove(
                    "dragging"
                );


                const deltaX =
                    touchCurrentX -
                    touchStartX;


                const threshold =
                    Math.max(
                        55,
                        window.innerWidth * 0.14
                    );


                /*
                 * Zu kleiner Swipe:
                 * zurück zur aktuellen Position.
                 */
                if (
                    Math.abs(deltaX) < threshold
                ) {

                    setCurrentPosition(true);

                    return;
                }


                /*
                 * Nach links:
                 */
                if (deltaX < 0) {

                    /*
                     * Seite 1 links
                     * ->
                     * Seite 1 rechts
                     */
                    if (mobileSide === 0) {

                        mobileSide = 1;

                        setCurrentPosition(true);

                        return;
                    }


                    /*
                     * Seite 1 rechts
                     * ->
                     * Seite 2 links
                     */
                    isAnimating = true;

                    changeMobilePage(1);


                    setTimeout(() => {

                        isAnimating = false;

                    }, 800);


                    return;
                }


                /*
                 * Nach rechts:
                 */
                if (deltaX > 0) {

                    /*
                     * Rechte Ansicht
                     * ->
                     * linke Ansicht derselben Seite
                     */
                    if (mobileSide === 1) {

                        mobileSide = 0;

                        setCurrentPosition(true);

                        return;
                    }


                    /*
                     * Linke Ansicht Seite 2
                     * ->
                     * rechte Ansicht Seite 1
                     */
                    isAnimating = true;

                    changeMobilePage(-1);


                    setTimeout(() => {

                        isAnimating = false;

                    }, 800);
                }

            },
            {
                passive: true
            }
        );



        /* =========================================================
           RESIZE
           ========================================================= */

        window.addEventListener(
            "resize",
            () => {

                setCurrentPosition(false);
            }
        );



        /* =========================================================
           INITIALISIERUNG
           ========================================================= */

        function initialize() {

            updateDesktop();


            /*
             * Mobile:
             *
             * Seite 1
             * linke Ansicht
             */
            mobileCurrentPage = 1;

            mobileSide = 0;


            setMobileImage(
                mobileCurrentPage
            );


            setCurrentPosition(false);
        }


        /* =========================================================
           START
           ========================================================= */

        findPages();

    </script>

</body>
</html>
