<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #ffffff;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================================
           DESKTOP
        ========================================================= */

        .portfolio {
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================================================
           DESKTOP A4
        ========================================================= */

        .sheet {
            position: relative;

            width: min(84vw, 1200px);
            aspect-ratio: 297 / 210;

            background: #ffffff;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: visible;
        }


        /* =========================================================
           DESKTOP BILD
        ========================================================= */

        #portfolioImage {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: none;
        }

        #portfolioImage.visible {
            display: block;
        }


        /* =========================================================
           DESKTOP PFEILE
        ========================================================= */

        .arrow {
            position: absolute;

            top: 50%;

            width: 30px;
            height: 50px;

            padding: 0;
            margin: 0;

            border: none;
            outline: none;

            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transform: translateY(-50%);

            z-index: 10;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }

        .arrow:hover {
            opacity: 0.6;
        }

        .arrow:focus,
        .arrow:focus-visible,
        .arrow:active {
            outline: none;
            border: none;
            box-shadow: none;
        }

        .arrow svg {
            width: 18px;
            height: 32px;

            display: block;
        }

        .arrow-left {
            left: -55px;
        }

        .arrow-left svg {
            transform: rotate(180deg);
        }

        .arrow-left:hover {
            transform: translate(-5px, -50%);
        }

        .arrow-right {
            right: -55px;
        }

        .arrow-right:hover {
            transform: translate(5px, -50%);
        }

        .arrow.disabled {
            opacity: 0.15;
            pointer-events: none;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 800px) {

            .portfolio {
                width: 100vw;
                height: 100svh;

                display: flex;
                align-items: center;
                justify-content: center;

                overflow: hidden;
            }


            /* =====================================================
               MOBILE VIEWPORT
            ===================================================== */

            .mobile-viewport {
                position: relative;

                width: 100vw;
                height: 100svh;

                overflow: hidden;

                touch-action: pan-y;
            }


            /* =====================================================
               MOBILE TRACK
            ===================================================== */

            .mobile-track {
                position: absolute;

                top: 50%;
                left: 0;

                height: min(
                    88vw * 210 / 297,
                    86svh
                );

                display: flex;
                align-items: center;

                will-change: transform;
            }


            /* =====================================================
               MOBILE SEITE / FENSTER
               
               WICHTIG:
               overflow:hidden verhindert das doppelte Bild.
            ===================================================== */

            .mobile-page {
                position: relative;

                width: 100vw;
                height: 100%;

                flex: 0 0 100vw;

                overflow: hidden;

                background: #ffffff;

                /*
                 * Seitenschatten
                 */
                box-shadow:
                    0 12px 35px rgba(0, 0, 0, 0.20);
            }


            /* =====================================================
               A4 BILD

               176vw bedeutet:
               Eine komplette A4-Seite ist 176vw breit.

               Dadurch sehen wir ungefähr 57 % der Seite,
               also etwas mehr als die Hälfte.
            ===================================================== */

            .mobile-page img {
                position: absolute;

                top: 50%;

                width: 176vw;
                height: auto;

                max-width: none;

                transform: translateY(-50%);

                display: block;

                user-select: none;
                -webkit-user-drag: none;

                pointer-events: none;
            }


            /* =====================================================
               LINKE SEITE

               Zeigt den linken Bereich des A4-Blattes.
            ===================================================== */

            .mobile-page.left img {
                left: 0;
            }


            /* =====================================================
               RECHTE SEITE

               Zeigt den rechten Bereich desselben A4-Blattes.
            ===================================================== */

            .mobile-page.right img {
                left: -76vw;
            }


            /* =====================================================
               BUCHFALZ / SEITENKANTE
            ===================================================== */

            .mobile-page.left::after,
            .mobile-page.right::after {
                content: "";

                position: absolute;

                top: 0;
                bottom: 0;

                width: 5px;

                pointer-events: none;

                z-index: 5;
            }


            .mobile-page.left::after {
                right: 0;

                background:
                    linear-gradient(
                        to left,
                        rgba(0, 0, 0, 0.12),
                        rgba(0, 0, 0, 0.03),
                        transparent
                    );
            }


            .mobile-page.right::after {
                left: 0;

                background:
                    linear-gradient(
                        to right,
                        rgba(0, 0, 0, 0.12),
                        rgba(0, 0, 0, 0.03),
                        transparent
                    );
            }


            /* =====================================================
               DESKTOP AUSBLENDEN
            ===================================================== */

            .sheet {
                display: none;
            }

        }

    </style>
</head>


<body>

    <main class="portfolio">


        <!-- =====================================================
             DESKTOP
        ===================================================== -->

        <div class="sheet">

            <img
                id="portfolioImage"
                alt="Portfolio"
            >


            <!-- LINKER PFEIL -->

            <button
                id="prevButton"
                class="arrow arrow-left disabled"
                aria-label="Vorherige Seite"
            >

                <svg
                    viewBox="0 0 462.45 818.53"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polygon
                        fill="#1d1d1b"
                        points="
                            462.3 409.25
                            462.41 409.14
                            53.27 0
                            0 53.27
                            356.01 409.28
                            .04 765.26
                            53.31 818.53
                            462.45 409.39
                            462.3 409.25
                        "
                    />

                </svg>

            </button>


            <!-- RECHTER PFEIL -->

            <button
                id="nextButton"
                class="arrow arrow-right disabled"
                aria-label="Nächste Seite"
            >

                <svg
                    viewBox="0 0 462.45 818.53"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polygon
                        fill="#1d1d1b"
                        points="
                            462.3 409.25
                            462.41 409.14
                            53.27 0
                            0 53.27
                            356.01 409.28
                            .04 765.26
                            53.31 818.53
                            462.45 409.39
                            462.3 409.25
                        "
                    />

                </svg>

            </button>

        </div>


        <!-- =====================================================
             MOBILE
        ===================================================== -->

        <div
            class="mobile-viewport"
            id="mobileViewport"
        >

            <div
                class="mobile-track"
                id="mobileTrack"
            ></div>

        </div>

    </main>


    <script>

        /* =========================================================
           ELEMENTE
        ========================================================= */

        const image =
            document.getElementById(
                "portfolioImage"
            );

        const prevButton =
            document.getElementById(
                "prevButton"
            );

        const nextButton =
            document.getElementById(
                "nextButton"
            );

        const mobileTrack =
            document.getElementById(
                "mobileTrack"
            );

        const mobileViewport =
            document.getElementById(
                "mobileViewport"
            );


        /* =========================================================
           BILDORDNER
        ========================================================= */

        const IMAGE_FOLDER =
            "images/portfolio";


        /* =========================================================
           VARIABLEN
        ========================================================= */

        let currentPage = 1;
        let maxPage = 0;

        /*
         * MOBILE POSITION
         *
         * 0 = Seite 1 links
         * 1 = Seite 1 rechts
         * 2 = Seite 2 links
         * 3 = Seite 2 rechts
         * usw.
         */

        let mobilePosition = 0;


        /* =========================================================
           PRÜFEN OB BILD EXISTIERT
        ========================================================= */

        function checkImage(number) {

            return new Promise(resolve => {

                const testImage =
                    new Image();

                testImage.onload =
                    () => resolve(true);

                testImage.onerror =
                    () => resolve(false);

                testImage.src =
                    `${IMAGE_FOLDER}/${number}.png`;

            });

        }


        /* =========================================================
           ALLE BILDER FINDEN
        ========================================================= */

        async function findImages() {

            maxPage = 0;

            for (
                let number = 1;
                number <= 100;
                number++
            ) {

                const exists =
                    await checkImage(number);

                if (!exists) {
                    break;
                }

                maxPage = number;
            }


            if (maxPage === 0) {
                updateButtons();
                return;
            }


            /* DESKTOP */

            showImage(1);


            /* MOBILE */

            createMobilePages();

        }


        /* =========================================================
           DESKTOP BILD
        ========================================================= */

        function showImage(number) {

            if (
                number < 1 ||
                number > maxPage
            ) {
                return;
            }

            currentPage = number;

            image.src =
                `${IMAGE_FOLDER}/${number}.png`;

            image.classList.add(
                "visible"
            );

            updateButtons();

        }


        /* =========================================================
           DESKTOP PFEILE
        ========================================================= */

        function updateButtons() {

            if (maxPage === 0) {

                prevButton.classList.add(
                    "disabled"
                );

                nextButton.classList.add(
                    "disabled"
                );

                return;
            }


            if (currentPage <= 1) {

                prevButton.classList.add(
                    "disabled"
                );

            } else {

                prevButton.classList.remove(
                    "disabled"
                );

            }


            if (
                currentPage >= maxPage
            ) {

                nextButton.classList.add(
                    "disabled"
                );

            } else {

                nextButton.classList.remove(
                    "disabled"
                );

            }

        }


        /* =========================================================
           DESKTOP ZURÜCK
        ========================================================= */

        prevButton.addEventListener(
            "click",
            () => {

                if (
                    currentPage > 1
                ) {

                    showImage(
                        currentPage - 1
                    );

                }

            }
        );


        /* =========================================================
           DESKTOP WEITER
        ========================================================= */

        nextButton.addEventListener(
            "click",
            () => {

                if (
                    currentPage < maxPage
                ) {

                    showImage(
                        currentPage + 1
                    );

                }

            }
        );


        /* =========================================================
           MOBILE SEITEN ERSTELLEN
        ========================================================= */

        function createMobilePages() {

            mobileTrack.innerHTML = "";


            for (
                let page = 1;
                page <= maxPage;
                page++
            ) {


                /* =============================================
                   LINKE POSITION
                ============================================= */

                const left =
                    document.createElement(
                        "div"
                    );

                left.className =
                    "mobile-page left";

                left.innerHTML = `
                    <img
                        src="${IMAGE_FOLDER}/${page}.png"
                        alt="Portfolio Seite ${page}"
                        draggable="false"
                    >
                `;

                mobileTrack.appendChild(
                    left
                );


                /* =============================================
                   RECHTE POSITION
                ============================================= */

                const right =
                    document.createElement(
                        "div"
                    );

                right.className =
                    "mobile-page right";

                right.innerHTML = `
                    <img
                        src="${IMAGE_FOLDER}/${page}.png"
                        alt="Portfolio Seite ${page}"
                        draggable="false"
                    >
                `;

                mobileTrack.appendChild(
                    right
                );

            }


            mobilePosition = 0;

            updateMobilePosition(false);

        }


        /* =========================================================
           MOBILE POSITION AKTUALISIEREN
        ========================================================= */

        function updateMobilePosition(
            animate = true
        ) {

            if (animate) {

                mobileTrack.style.transition =
                    "transform 0.40s cubic-bezier(0.22, 0.61, 0.36, 1)";

            } else {

                mobileTrack.style.transition =
                    "none";

            }


            mobileTrack.style.transform =
                `translate3d(
                    ${-mobilePosition * 100}vw,
                    -50%,
                    0
                )`;

        }


        /* =========================================================
           SWIPE
        ========================================================= */

        let touchStartX = 0;
        let touchCurrentX = 0;

        let isDragging = false;


        mobileViewport.addEventListener(
            "touchstart",
            event => {

                if (
                    event.touches.length !== 1
                ) {
                    return;
                }

                isDragging = true;

                touchStartX =
                    event.touches[0].clientX;

                touchCurrentX =
                    touchStartX;

                mobileTrack.style.transition =
                    "none";

            },
            {
                passive: true
            }
        );


        mobileViewport.addEventListener(
            "touchmove",
            event => {

                if (!isDragging) {
                    return;
                }

                touchCurrentX =
                    event.touches[0].clientX;

                const delta =
                    touchCurrentX -
                    touchStartX;

                const basePosition =
                    -mobilePosition *
                    window.innerWidth;


                mobileTrack.style.transform =
                    `translate3d(
                        ${basePosition + delta}px,
                        -50%,
                        0
                    )`;

            },
            {
                passive: true
            }
        );


        mobileViewport.addEventListener(
            "touchend",
            () => {

                if (!isDragging) {
                    return;
                }

                isDragging = false;


                const delta =
                    touchCurrentX -
                    touchStartX;


                const threshold =
                    Math.min(
                        70,
                        window.innerWidth * 0.18
                    );


                /* SWIPE NACH LINKS */

                if (
                    delta < -threshold &&
                    mobilePosition <
                    maxPage * 2 - 1
                ) {

                    mobilePosition++;

                }


                /* SWIPE NACH RECHTS */

                else if (
                    delta > threshold &&
                    mobilePosition > 0
                ) {

                    mobilePosition--;

                }


                updateMobilePosition(true);

            }
        );


        /* =========================================================
           TOUCH ABGEBROCHEN
        ========================================================= */

        mobileViewport.addEventListener(
            "touchcancel",
            () => {

                if (!isDragging) {
                    return;
                }

                isDragging = false;

                updateMobilePosition(true);

            }
        );


        /* =========================================================
           DESKTOP TASTATUR
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "ArrowLeft" &&
                    currentPage > 1
                ) {

                    showImage(
                        currentPage - 1
                    );

                }


                if (
                    event.key === "ArrowRight" &&
                    currentPage < maxPage
                ) {

                    showImage(
                        currentPage + 1
                    );

                }

            }
        );


        /* =========================================================
           RESIZE
        ========================================================= */

        window.addEventListener(
            "resize",
            () => {

                if (
                    window.innerWidth <= 800
                ) {

                    updateMobilePosition(false);

                }

            }
        );


        /* =========================================================
           START
        ========================================================= */

        findImages();

    </script>

</body>
</html>
