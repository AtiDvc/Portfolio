```
<title>Portfolio</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
    }

    body {
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
    }


    /* =========================
       DESKTOP
    ========================= */

    .home {
        width: 100%;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 70px;

        padding: 40px;
    }

    .cover {
        height: 88vh;
        width: auto;

        max-width: 75vw;

        object-fit: contain;

        display: block;
    }

    .next {
        width: 64px;
        height: 64px;

        display: flex;
        align-items: center;
        justify-content: center;

        flex-shrink: 0;

        text-decoration: none;

        transition:
            transform 0.25s ease;
    }

    .next svg {
        width: 22px;
        height: auto;

        display: block;
    }

    .next:hover {
        transform: translateX(8px);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        .home {
            width: 100%;
            height: 100svh;

            display: flex;
            flex-direction: row;

            align-items: center;
            justify-content: center;

            /*
             * Kein zusätzlicher Abstand.
             * Der Pfeil wird unten über margin-left
             * gezielt über das Cover gezogen.
             */
            gap: 0;

            padding: 20px 12px;

            overflow: hidden;
        }


        .cover {
            /*
             * Das Cover bleibt so groß wie bisher.
             */
            width: auto;

            height: min(
                82svh,
                calc((100vw - 72px) * 1.414)
            );

            max-width: calc(100vw - 72px);

            object-fit: contain;

            flex-shrink: 1;

            display: block;
        }


        .next {
            width: 26px;
            height: 50px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            /*
             * Der Pfeil liegt etwas über dem
             * rechten Rand des Covers.
             *
             * Gleichzeitig wird die Gruppe durch
             * margin-left kleiner, sodass das Cover
             * entsprechend weiter nach rechts rückt
             * und die gesamte Kombination zentriert bleibt.
             */
            margin-left: -10px;

            position: relative;
            z-index: 2;
        }


        .next svg {
            width: 14px;
            height: auto;

            display: block;
        }


        /*
         * Auf Touch-Geräten kein Hover-Effekt.
         */
        .next:hover {
            transform: none;
        }
    }

</style>
```

</head>

<body>

<main class="home">

    <img

                    53.31 818.53
                    462.45 409.39
                    462.3 409.25
                "
            />

        </svg>

    </a>

</main>
