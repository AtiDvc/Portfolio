<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portfolio</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* =========================
           DESKTOP
        ========================= */

        .home {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 70px;
            padding: 40px;
        }

        .cover {
            height: 88vh;
            width: auto;

            max-width: 75vw;

            object-fit: contain;
            display: block;
        }

        .next {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            text-decoration: none;

            transition:
                transform 0.25s ease;
        }

        .next svg {
            width: 22px;
            height: auto;

            display: block;
        }

        .next:hover {
            transform: translateX(8px);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .home {
                position: relative;

                width: 100%;
                height: 100svh;

                display: block;

                padding: 0;

                overflow: hidden;
            }


            /*
             * COVER
             *
             * Exakt horizontal zentriert.
             *
             * Der Mittelpunkt des Covers liegt immer
             * bei 50% der Bildschirmbreite.
             */
            .cover {
                position: absolute;

                left: 50%;
                top: 50%;

                transform:
                    translate(-50%, -50%);

                width: auto;

                height: min(
                    82svh,
                    calc((100vw - 72px) * 1.414)
                );

                max-width: calc(100vw - 72px);

                object-fit: contain;

                display: block;

                /*
                 * Das Bild selbst kann nicht angeklickt
                 * oder als Link verwendet werden.
                 */
                pointer-events: none;

                user-select: none;
                -webkit-user-select: none;

                -webkit-user-drag: none;

                z-index: 1;
            }


            /*
             * PFEIL
             *
             * Exakt bei 75% der Bildschirmbreite.
             */
            .next {
                position: absolute;

                left: 75%;
                top: 50%;

                transform:
                    translate(-50%, -50%);

                width: 32px;
                height: 50px;

                display: flex;
                align-items: center;
                justify-content: center;

                padding: 0;
                margin: 0;

                z-index: 2;

                flex-shrink: 0;
            }


            .next svg {
                width: 14px;
                height: auto;

                display: block;
            }


            /*
             * Kein Desktop-Hover-Effekt auf Mobile.
             */
            .next:hover {
                transform:
                    translate(-50%, -50%);
            }
        }

    </style>
</head>


<body>

    <main class="home">


        <!-- =========================
             COVER
        ========================= -->

        <img
            src="images/Cover.png"
            alt="Portfolio Cover"
            class="cover"
            draggable="false"
        >


        <!-- =========================
             PORTFOLIO BUTTON
        ========================= -->

        <a
            href="portfolio.html"
            class="next"
            aria-label="Portfolio öffnen"
        >

            <svg
                viewBox="0 0 462.45 818.53"
                xmlns="http://www.w3.org/2000/svg"
            >

                <polygon
                    fill="#1d1d1b"
                    points="
                        462.3 409.25
                        462.41 409.14
                        53.27 0
                        0 53.27
                        356.01 409.28
                        .04 765.26
                        53.31 818.53
                        462.45 409.39
                        462.3 409.25
                    "
                />

            </svg>

        </a>


    </main>

</body>
</html>
