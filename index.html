<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        .home {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 70px;
            padding: 40px;
        }

        /* COVER */

        .cover {
            height: 88vh;
            width: auto;
            max-width: 75vw;

            object-fit: contain;
            display: block;

            /*box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.15); */
        }

        /* PFEIL */

        .next {
    width: 64px;
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;

    transition: transform 0.25s ease;
}

.next svg {
    width: 22px;
    height: auto;
    display: block;
}

.next:hover {
    transform: translateX(8px);
}ffff;
}

        /* MOBILE */

        @media (max-width: 600px) {
    .home {
        min-height: 100svh;
        padding: 20px 18px;
    }

    .cover {
        width: min(82vw, 420px);
        height: auto;
        max-width: none;
    }

    .next {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
    }

    .next svg {
        width: 18px;
    }
}
    </style>
</head>

<body>

    <main class="home">

        <img src="images/Cover.png" alt="Portfolio Cover" class="cover">

        <a href="portfolio.html" class="next" aria-label="Portfolio öffnen">
    <svg
        viewBox="0 0 462.45 818.53"
        xmlns="http://www.w3.org/2000/svg"
    >
        <polygon
            fill="#1d1d1b"
            points="
                462.3 409.25
                462.41 409.14
                53.27 0
                0 53.27
                356.01 409.28
                .04 765.26
                53.31 818.53
                462.45 409.39
                462.3 409.25
            "
        />
    </svg>
</a>

    </main>

</body>
</html>
